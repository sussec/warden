services:
  web:
    image: ghcr.io/sussec/warden-web:latest
    build:
      context: ./warden-web
      dockerfile: Dockerfile
      args:
        API_INTERNAL_URL: http://warden:8080
    pull_policy: build
    depends_on:
      - warden
    environment:
      API_INTERNAL_URL: http://warden:8080
    ports:
      - "8080:3000" # main entry point

  warden:
    image: ghcr.io/sussec/warden:latest
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    depends_on:
      - db
    environment:
      DB_SERVER: db
      DB_USERNAME: ${POSTGRES_USER:-warden}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-warden}
      DB_NAME: ${POSTGRES_DB:-warden}
      SYSTEM_PASSWORD: ${SYSTEM_PASSWORD:?set SYSTEM_PASSWORD in .env}
      ACCESS_TOKEN_KEY: ${ACCESS_TOKEN_KEY:?set ACCESS_TOKEN_KEY in .env}
      REFRESH_TOKEN_KEY: ${REFRESH_TOKEN_KEY:?set REFRESH_TOKEN_KEY in .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      OPENAPI_ENABLED: ${OPENAPI_ENABLED:-true}
      AI_ENDPOINT: ${AI_ENDPOINT:-}
      AI_MODEL: ${AI_MODEL:-}
      WARDEN_AI_API_KEY: ${WARDEN_AI_API_KEY:-}
      # UI-triggered scans: runner launches scan-profile images as sibling
      # containers over the docker socket below (omit the mount to disable).
      WARDEN_TOKEN: ${WARDEN_TOKEN:-}
      SCAN_IMAGE_PREFIX: ${SCAN_IMAGE_PREFIX:-warden-}
      SCAN_NETWORK: ${SCAN_NETWORK:-warden_default}
      # git-URL scan targets are cloned into this shared volume (mounted into
      # both this container and the scanner containers the runner launches).
      SCAN_WORKSPACE_VOLUME: ${SCAN_WORKSPACE_VOLUME:-warden_scan_workspace}
      SCAN_WORKSPACE_PATH: /scan-workspace
      SCAN_GIT_TOKEN: ${SCAN_GIT_TOKEN:-}
      # OSV.dev advisory enrichment (warden-osv sidecar; empty disables)
      OSV_SERVICE_URL: ${OSV_SERVICE_URL:-http://osv-api:9000}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - scan_workspace:/scan-workspace
    # docker group id of the host socket (`stat -c %g /var/run/docker.sock`)
    # so the non-root app user may talk to the daemon
    group_add:
      - "${DOCKER_GID:-957}"
    ports:
      - "5272:8080" # direct API access for dev tooling (bun run gen-api)

  # OSV.dev advisory enrichment sidecar (Go) — cached, typed facade over
  # https://api.osv.dev consumed by warden-api for finding/package drill-down.
  osv-api:
    image: ghcr.io/sussec/warden-osv:latest
    build:
      context: ./warden-osv
      dockerfile: Dockerfile
    pull_policy: build
    environment:
      OSV_URL: ${OSV_URL:-https://api.osv.dev}
      CACHE_TTL: ${OSV_CACHE_TTL:-1h}
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-warden}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-warden}
      POSTGRES_DB: ${POSTGRES_DB:-warden}
      PGDATA: /data/postgres
    volumes:
      - warden_db:/data/postgres
    ports:
      - "54321:5432"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Local AI inference engines (profile: local-ai) — OpenAI-compatible /v1, so
  # Warden talks to them via Setting > AI (point the endpoint at the service).
  #   docker compose --profile local-ai up -d llama         # CPU, lightweight
  #   docker compose --profile ai-gpu  up -d vllm           # GPU, production
  # ---------------------------------------------------------------------------

  # llama.cpp server — lightweight CPU inference, runs anywhere (laptop to RPi).
  # Serves an embedding model on http://llama:8080/v1 (nomic-embed-text = 768 dims).
  # Set Setting > AI: Embedding endpoint http://llama:8080/v1, dimension 768.
  llama:
    profiles: ["local-ai"]
    image: ghcr.io/ggml-org/llama.cpp:server
    command: >-
      -hf ${LLAMA_EMBED_MODEL:-nomic-ai/nomic-embed-text-v1.5-GGUF}
      --embeddings --pooling mean --host 0.0.0.0 --port 8080
    ports:
      - "8090:8080" # direct access for testing
    restart: unless-stopped

  # vLLM — high-throughput production serving (PagedAttention). Requires an
  # NVIDIA GPU. Serves http://vllm:8000/v1. Pick an embedding or chat model.
  vllm:
    profiles: ["ai-gpu"]
    image: vllm/vllm-openai:latest
    command: ["--model", "${VLLM_MODEL:-intfloat/e5-mistral-7b-instruct}", "--task", "embed"]
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]
    ipc: host
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Security scanners (profile: scan) — run on demand against a local checkout:
  #   SCAN_TARGET=/path/to/repo docker compose --profile scan run --rm semgrep
  #   SCAN_TARGET=/path/to/repo docker compose --profile scan run --rm gitleaks
  #   SCAN_TARGET=/path/to/repo docker compose --profile scan run --rm trivy
  # Requires WARDEN_TOKEN (Setting > Access Token) in .env.
  # ---------------------------------------------------------------------------
  semgrep:
    profiles: ["scan"]
    build:
      context: ./scanners/quarkus
      dockerfile: scanner-semgrep/Dockerfile
    pull_policy: build
    environment: &scanner-env
      WARDEN_URL: http://warden:8080
      WARDEN_TOKEN: ${WARDEN_TOKEN:-}
      REPO_NAME: ${SCAN_REPO_NAME:-}
      BRANCH: ${SCAN_BRANCH:-}
      COMMIT: ${SCAN_COMMIT:-}
    volumes:
      - ${SCAN_TARGET:-.}:/src:ro

  gitleaks:
    profiles: ["scan"]
    build:
      context: ./scanners/quarkus
      dockerfile: scanner-gitleaks/Dockerfile
    pull_policy: build
    environment: *scanner-env
    volumes:
      - ${SCAN_TARGET:-.}:/src:ro

  trivy:
    profiles: ["scan"]
    build:
      context: ./scanners/quarkus
      dockerfile: scanner-trivy/Dockerfile
    pull_policy: build
    environment: *scanner-env
    volumes:
      - ${SCAN_TARGET:-.}:/src:ro

  # SCA second opinion + SBOM-grade dependency resolution
  grype:
    profiles: ["scan"]
    build:
      context: ./scanners/quarkus
      dockerfile: scanner-grype/Dockerfile
    pull_policy: build
    environment: *scanner-env
    volumes:
      - ${SCAN_TARGET:-.}:/src:ro

  # supply-chain SCA across many ecosystems via Google's OSV.dev advisories
  osv:
    profiles: ["scan"]
    build:
      context: ./scanners/quarkus
      dockerfile: scanner-osv/Dockerfile
    pull_policy: build
    environment: *scanner-env
    volumes:
      - ${SCAN_TARGET:-.}:/src:ro

  # JS/TS lockfile SCA (OWASP CVE Lite CLI) — validated fix versions,
  # direct vs transitive classification, OSV.dev advisories
  cve-lite:
    profiles: ["scan"]
    build:
      context: ./scanners/quarkus
      dockerfile: scanner-cve-lite/Dockerfile
    pull_policy: build
    environment:
      <<: *scanner-env
      CVE_LITE_OSV_URL: ${CVE_LITE_OSV_URL:-}
      CVE_LITE_OFFLINE: ${CVE_LITE_OFFLINE:-}
      CVE_LITE_OFFLINE_DB: ${CVE_LITE_OFFLINE_DB:-}
      # CI policy gates (exit 3 on violation, after upload). KEV/EPSS gates need
      # WARDEN_OSV_URL to reach the warden-osv enrichment sidecar.
      CVE_LITE_FAIL_ON_SEVERITY: ${CVE_LITE_FAIL_ON_SEVERITY:-}
      CVE_LITE_FAIL_ON_KEV: ${CVE_LITE_FAIL_ON_KEV:-}
      CVE_LITE_FAIL_ON_EPSS: ${CVE_LITE_FAIL_ON_EPSS:-}
      WARDEN_OSV_URL: ${WARDEN_OSV_URL:-http://osv-api:9000}
    volumes:
      - ${SCAN_TARGET:-.}:/src:ro

  # Rust/Cargo SCA (RustSec cargo-audit) — a Rust-native scanner that talks the
  # same HTTP+JSON CI contract as the Quarkus scanners (build context: rust).
  cargo-audit:
    profiles: ["scan"]
    build:
      context: ./scanners/rust
      dockerfile: scanner-cargo-audit/Dockerfile
    pull_policy: build
    environment: *scanner-env
    volumes:
      - ${SCAN_TARGET:-.}:/src:ro

  # Rust advisories + OSS license policy + banned crates (cargo-deny). Rust-native.
  cargo-deny:
    profiles: ["scan"]
    build:
      context: ./scanners/rust
      dockerfile: scanner-cargo-deny/Dockerfile
    pull_policy: build
    environment:
      <<: *scanner-env
      CARGO_DENY_CHECKS: ${CARGO_DENY_CHECKS:-}
    volumes:
      - ${SCAN_TARGET:-.}:/src:ro

  # Rust unsafe-usage counter (cargo-geiger). Compiles the project — heavier.
  cargo-geiger:
    profiles: ["scan"]
    build:
      context: ./scanners/rust
      dockerfile: scanner-cargo-geiger/Dockerfile
    pull_policy: build
    environment: *scanner-env
    volumes:
      - ${SCAN_TARGET:-.}:/src:ro

  # OSS license findings (Trivy license scanner) — per-package license policy.
  trivy-license:
    profiles: ["scan"]
    build:
      context: ./scanners/quarkus
      dockerfile: scanner-trivy-license/Dockerfile
    pull_policy: build
    environment:
      <<: *scanner-env
      TRIVY_LICENSE_FULL: ${TRIVY_LICENSE_FULL:-}
    volumes:
      - ${SCAN_TARGET:-.}:/src:ro

  # Kubernetes manifest posture (kubescape) — NSA/MITRE/CIS misconfig controls.
  kubescape:
    profiles: ["scan"]
    build:
      context: ./scanners/quarkus
      dockerfile: scanner-kubescape/Dockerfile
    pull_policy: build
    environment:
      <<: *scanner-env
      KUBESCAPE_FRAMEWORK: ${KUBESCAPE_FRAMEWORK:-}
      KUBESCAPE_ARGS: ${KUBESCAPE_ARGS:-}
    volumes:
      - ${SCAN_TARGET:-.}:/src:ro

  # Cloud security posture (Prowler CSPM) — audits a live AWS/Azure/GCP account.
  # Targets a provider, not a checkout; credentials come from the environment:
  #   PROWLER_PROVIDER=aws AWS_ACCESS_KEY_ID=... AWS_SECRET_ACCESS_KEY=... \
  #     docker compose --profile scan run --rm prowler
  prowler:
    profiles: ["scan"]
    build:
      context: ./scanners/quarkus
      dockerfile: scanner-prowler/Dockerfile
    pull_policy: build
    environment:
      <<: *scanner-env
      PROWLER_PROVIDER: ${PROWLER_PROVIDER:-aws}
      PROWLER_ARGS: ${PROWLER_ARGS:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}

  # SBOM generation — full dependency inventory (CycloneDX/SPDX-grade)
  syft:
    profiles: ["scan"]
    build:
      context: ./scanners/quarkus
      dockerfile: scanner-syft/Dockerfile
    pull_policy: build
    environment: *scanner-env
    volumes:
      - ${SCAN_TARGET:-.}:/src:ro

  # IaC misconfiguration scanning with a large ruleset (Terraform, K8s, ...)
  checkov:
    profiles: ["scan"]
    build:
      context: ./scanners/quarkus
      dockerfile: scanner-checkov/Dockerfile
    pull_policy: build
    environment: *scanner-env
    volumes:
      - ${SCAN_TARGET:-.}:/src:ro

  # semantic SAST (GitHub CodeQL) — data-flow/taint queries, build-mode none.
  # Resource-heavy (~2-3GB bundle, several GB RAM/language).
  codeql:
    profiles: ["scan"]
    build:
      context: ./scanners/quarkus
      dockerfile: scanner-codeql/Dockerfile
    pull_policy: build
    environment:
      <<: *scanner-env
      CODEQL_LANGUAGES: ${CODEQL_LANGUAGES:-}
      CODEQL_THREADS: ${CODEQL_THREADS:-}
      CODEQL_RAM: ${CODEQL_RAM:-}
    volumes:
      - ${SCAN_TARGET:-.}:/src:ro

  # malicious-package detection in dependency manifests (typosquatting, etc.)
  guarddog:
    profiles: ["scan"]
    build:
      context: ./scanners/quarkus
      dockerfile: scanner-guarddog/Dockerfile
    pull_policy: build
    environment: *scanner-env
    volumes:
      - ${SCAN_TARGET:-.}:/src:ro

  # AI-agent deep SAST (vercel-labs/deepsec). Pipeline mode uses Warden's own
  # AI config (single source of truth) and costs real model spend — budget-cap
  # with DEEPSEC_LIMIT. Bridge mode ingests a CI-produced export via
  # DEEPSEC_REPORT. See docs/security-integration/sast/deepsec.md.
  deepsec:
    profiles: ["scan"]
    build:
      context: ./scanners/quarkus
      dockerfile: scanner-deepsec/Dockerfile
    pull_policy: build
    environment:
      <<: *scanner-env
      # reuse Warden's configured model endpoint as the deepsec gateway
      AI_ENDPOINT: ${AI_ENDPOINT:-}
      AI_MODEL: ${AI_MODEL:-}
      WARDEN_AI_API_KEY: ${WARDEN_AI_API_KEY:-}
      DEEPSEC_LIMIT: ${DEEPSEC_LIMIT:-50}
      DEEPSEC_AGENT: ${DEEPSEC_AGENT:-codex}
      DEEPSEC_REPORT: ${DEEPSEC_REPORT:-}
    volumes:
      - ${SCAN_TARGET:-.}:/src:ro

  # Secret detection with live validation (MongoDB Kingfisher) — confirms
  # whether a leaked credential is still active; validated keys → Critical.
  kingfisher:
    profiles: ["scan"]
    build:
      context: ./scanners/quarkus
      dockerfile: scanner-kingfisher/Dockerfile
    pull_policy: build
    environment:
      <<: *scanner-env
      KINGFISHER_NO_VALIDATE: ${KINGFISHER_NO_VALIDATE:-}
    volumes:
      - ${SCAN_TARGET:-.}:/src:ro

  # SCA via CPE/NVD matching (OWASP Dependency-Check). An NVD API key is
  # strongly recommended; persist the data cache to avoid re-downloading the NVD.
  dependency-check:
    profiles: ["scan"]
    build:
      context: ./scanners/quarkus
      dockerfile: scanner-dependency-check/Dockerfile
    pull_policy: build
    environment:
      <<: *scanner-env
      NVD_API_KEY: ${NVD_API_KEY:-}
      DEPENDENCY_CHECK_NOUPDATE: ${DEPENDENCY_CHECK_NOUPDATE:-}
    volumes:
      - ${SCAN_TARGET:-.}:/src:ro
      - dependency_check_data:/usr/share/dependency-check/data

  # Web server DAST (Nikto) — probes a live HTTP(S) target. Set SCAN_TARGET_URL
  # (same convention as zap/nuclei):
  #   SCAN_TARGET_URL=https://example.com docker compose --profile scan run --rm nikto
  nikto:
    profiles: ["scan"]
    build:
      context: ./scanners/quarkus
      dockerfile: scanner-nikto/Dockerfile
    pull_policy: build
    environment:
      <<: *scanner-env
      TARGET_URL: ${SCAN_TARGET_URL:-}
      NIKTO_TUNING: ${NIKTO_TUNING:-}
      NIKTO_MAXTIME: ${NIKTO_MAXTIME:-}

  # LLM / GenAI red-team (Augustus) — probes a target model or OpenAI-compatible
  # endpoint for jailbreaks, prompt injection, encoding exploits, data leakage.
  # Targets an endpoint, not a checkout. Set AUGUSTUS_GENERATOR (+ AUGUSTUS_CONFIG
  # for rest.Rest, or a provider API key env var). Smoke test with no key:
  #   AUGUSTUS_GENERATOR=test.Repeat AUGUSTUS_PROBES='exploitation.*' \
  #     docker compose --profile scan run --rm augustus
  augustus:
    profiles: ["scan"]
    build:
      context: ./scanners/quarkus
      dockerfile: scanner-augustus/Dockerfile
    pull_policy: build
    environment:
      <<: *scanner-env
      AUGUSTUS_GENERATOR: ${AUGUSTUS_GENERATOR:-}
      AUGUSTUS_CONFIG: ${AUGUSTUS_CONFIG:-}
      AUGUSTUS_PROBES: ${AUGUSTUS_PROBES:-}
      AUGUSTUS_DETECTORS: ${AUGUSTUS_DETECTORS:-}
      AUGUSTUS_ARGS: ${AUGUSTUS_ARGS:-}
      # provider keys Augustus reads directly when targeting a hosted model
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

  # git-history secret detection (complements gitleaks working-tree scan)
  trufflehog:
    profiles: ["scan"]
    build:
      context: ./scanners/quarkus
      dockerfile: scanner-trufflehog/Dockerfile
    pull_policy: build
    environment: *scanner-env
    volumes:
      - ${SCAN_TARGET:-.}:/src:ro

  # IaC / misconfiguration scanning (Terraform, K8s, Dockerfile)
  trivy-iac:
    profiles: ["scan"]
    build:
      context: ./scanners/quarkus
      dockerfile: scanner-trivy-iac/Dockerfile
    pull_policy: build
    environment: *scanner-env
    volumes:
      - ${SCAN_TARGET:-.}:/src:ro

  # container image vulnerability scanning — set SCAN_IMAGE_REF
  trivy-image:
    profiles: ["scan"]
    build:
      context: ./scanners/quarkus
      dockerfile: scanner-trivy-image/Dockerfile
    pull_policy: build
    environment:
      <<: *scanner-env
      IMAGE_REF: ${SCAN_IMAGE_REF:-}
    volumes:
      - ${SCAN_TARGET:-.}:/src:ro

  # DAST against a running target — set SCAN_TARGET_URL (no source mount)
  zap:
    profiles: ["scan"]
    build:
      context: ./scanners/quarkus
      dockerfile: scanner-zap/Dockerfile
    pull_policy: build
    environment:
      WARDEN_URL: http://warden:8080
      WARDEN_TOKEN: ${WARDEN_TOKEN:-}
      TARGET_URL: ${SCAN_TARGET_URL:-}

  nuclei:
    profiles: ["scan"]
    build:
      context: ./scanners/quarkus
      dockerfile: scanner-nuclei/Dockerfile
    pull_policy: build
    environment:
      WARDEN_URL: http://warden:8080
      WARDEN_TOKEN: ${WARDEN_TOKEN:-}
      TARGET_URL: ${SCAN_TARGET_URL:-}

volumes:
  warden_db:
  scan_workspace:
  dependency_check_data:
