# Techanv production values — domain only (no IPs)
# Harbor: https://harbor.techanv.com
# Warden: https://warden-prod.techanv.com (Cloudflare Tunnel)
#
# helm upgrade --install warden ./charts/warden -n warden --create-namespace \
#   -f charts/warden/values-techanv.yaml \
#   --set secrets.systemPassword='...' \
#   --set secrets.accessTokenKey='...' \
#   --set secrets.refreshTokenKey='...' \
#   --set secrets.postgresPassword='...'

global:
  imageRegistry: harbor.techanv.com
  imageProject: library

api:
  image:
    repository: warden
    tag: latest
    pullPolicy: Always
  replicaCount: 1
  # No Docker on k3s — UI fleet runs as Kubernetes Jobs (all plugins enabled)
  dockerSocket:
    enabled: false
  scanJobs:
    rbac: true
  env:
    frontendUrl: https://warden-prod.techanv.com
    openApiEnabled: "true"
    trustedProxies: "10.42.0.0/16,10.43.0.0/16"
    scanBackend: "kubernetes"
    # Scanners pulled from Harbor by domain (scripts/build-push-scanners.sh)
    scanImagePrefix: "harbor.techanv.com/library/warden-"
    # Optional if project is private:
    # kubectl -n warden create secret docker-registry harbor-pull \
    #   --docker-server=harbor.techanv.com --docker-username=… --docker-password=…
    scanImagePullSecret: ""
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

web:
  image:
    repository: warden-web
    tag: latest
    pullPolicy: Always
  replicaCount: 1
  apiInternalUrl: http://warden:8080
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

osv:
  image:
    repository: warden-osv
    tag: latest
    pullPolicy: Always
  replicaCount: 1

postgresql:
  image:
    repository: docker.io/pgvector/pgvector
    tag: pg18
    pullPolicy: IfNotPresent
  persistence:
    size: 20Gi

# Public access via Cloudflare Tunnel (not cluster Ingress)
ingress:
  enabled: false
