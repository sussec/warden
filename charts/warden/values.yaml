# Warden Helm chart — production-capable full stack
# Mirrors docker-compose core services: web, warden (api), osv-api, db (pgvector)
#
#   helm upgrade --install warden ./charts/warden -n warden --create-namespace \
#     --set secrets.systemPassword='...' \
#     --set secrets.accessTokenKey='...' \
#     --set secrets.refreshTokenKey='...' \
#     --set secrets.postgresPassword='...'
#
# Stock warden-web images rewrite to http://warden:8080 — keep api.compatServiceName=true.

nameOverride: ""
fullnameOverride: ""

global:
  # Harbor (or other registry) host — no trailing slash, no path.
  # Empty = use full repository paths as written under api/web/osv.image.repository
  # Techanv example: harbor.techanv.com
  imageRegistry: "harbor.techanv.com"
  # Project/namespace on the registry (Harbor project)
  imageProject: "library"
  imagePullSecrets: []
  # imagePullSecrets:
  #   - name: harbor-creds
  defaultStorageClass: ""

# ---------------------------------------------------------------------------
# Secrets
# ---------------------------------------------------------------------------
secrets:
  create: true
  existingSecret: ""
  # Keys when using existingSecret:
  #   system-password, access-token-key, refresh-token-key,
  #   postgres-password, warden-token, scan-git-token
  systemPassword: "ChangeMe_L0cal!"
  accessTokenKey: ""
  refreshTokenKey: ""
  postgresPassword: "warden"
  wardenToken: ""
  scanGitToken: ""

# ---------------------------------------------------------------------------
# PostgreSQL + pgvector (compose: db / pgvector/pgvector:pg18)
# ---------------------------------------------------------------------------
postgresql:
  enabled: true
  image:
    repository: pgvector/pgvector
    tag: pg18
    pullPolicy: IfNotPresent
  auth:
    username: warden
    database: warden
  service:
    port: 5432
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 2Gi
  podSecurityContext:
    fsGroup: 999
  securityContext:
    runAsUser: 999
    runAsGroup: 999
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
  external:
    host: ""
    port: 5432
    username: warden
    database: warden

# ---------------------------------------------------------------------------
# Warden API (compose: warden)
# ---------------------------------------------------------------------------
api:
  enabled: true
  compatServiceName: true
  image:
    # Final image: {global.imageRegistry}/{global.imageProject}/{repository}:{tag}
    # With defaults → harbor.techanv.com/library/warden:latest
    repository: warden
    tag: latest
    pullPolicy: Always
  replicaCount: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  service:
    type: ClusterIP
    port: 8080
    annotations: {}
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  env:
    openApiEnabled: "true"
    # Public UI URL (Cloudflare / ingress) — must match browser origin for cookies
    frontendUrl: "https://warden-prod.techanv.com"
    # Comma-separated proxy CIDRs (set to cluster pod CIDR / ingress when behind LB)
    trustedProxies: "10.42.0.0/16,10.43.0.0/16"
    aiEndpoint: ""
    aiModel: ""
    wardenAiApiKey: ""
    # Scanner images: harbor.techanv.com/library/warden-gitleaks etc.
    scanImagePrefix: "harbor.techanv.com/library/warden-"
    scanWorkspacePath: /scan-workspace
    osvServiceUrl: ""
  extraEnv: []
  # - name: MY_VAR
  #   value: "x"
  scanWorkspace:
    enabled: true
    size: 10Gi
    storageClass: ""
    # RWO is fine for replicaCount=1; use RWX (e.g. NFS/EFS) if scaling API
    accessModes:
      - ReadWriteOnce
  dockerSocket:
    enabled: false
    path: /var/run/docker.sock
    gid: 0
  podSecurityContext:
    fsGroup: 1654
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    runAsUser: 1654
    runAsGroup: 1654
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop: ["ALL"]
  livenessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 40
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  startupProbe:
    enabled: true
    httpGet:
      path: /healthz
      port: http
    periodSeconds: 5
    failureThreshold: 36
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  topologySpreadConstraints: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Prefer spreading API pods when multi-replica
  podAntiAffinity: soft

# ---------------------------------------------------------------------------
# Warden Web (compose: web)
# ---------------------------------------------------------------------------
web:
  enabled: true
  image:
    repository: warden-web
    tag: latest
    pullPolicy: Always
  replicaCount: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  service:
    type: ClusterIP
    port: 3000
    annotations: {}
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  # In-cluster API Service (compose-compatible name)
  apiInternalUrl: "http://warden:8080"
  extraEnv: []
  podSecurityContext:
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  livenessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 20
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAntiAffinity: soft

# ---------------------------------------------------------------------------
# OSV enrichment (compose: osv-api)
# ---------------------------------------------------------------------------
osv:
  enabled: true
  image:
    repository: warden-osv
    tag: latest
    pullPolicy: Always
  replicaCount: 1
  revisionHistoryLimit: 3
  service:
    type: ClusterIP
    port: 9000
  env:
    osvUrl: "https://api.osv.dev"
    cacheTtl: "1h"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: "1"
      memory: 256Mi
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    runAsUser: 65532
    runAsGroup: 65532
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  livenessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 15
    periodSeconds: 30
    failureThreshold: 6
  readinessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 5
    periodSeconds: 15
    failureThreshold: 6
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 75
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAntiAffinity: soft

# ---------------------------------------------------------------------------
# NetworkPolicy — default deny ingress inside the release namespace
# ---------------------------------------------------------------------------
networkPolicy:
  enabled: false
  # Allow web → api, api → postgresql, api → osv, and DNS
  # Egress: api/osv may reach external (OSV.dev, AI, SCM) unless restrictEgress=true
  restrictEgress: false

# ---------------------------------------------------------------------------
# Ingress
# ---------------------------------------------------------------------------
ingress:
  # Prefer Cloudflare Tunnel public hostnames; set enabled=true only for cluster Ingress
  enabled: false
  className: traefik
  annotations: {}
  hosts:
    - host: warden-prod.techanv.com
      paths:
        - path: /
          pathType: Prefix
          service: web
  tls: []

apiIngress:
  enabled: false
  className: traefik
  annotations: {}
  hosts:
    - host: api.techanv.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Optional Prometheus Operator ServiceMonitors
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}
