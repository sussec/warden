{{- if .Values.osv.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "warden.osvServiceName" . }}
  labels:
    {{- include "warden.labels" . | nindent 4 }}
    app.kubernetes.io/component: osv
spec:
  type: {{ .Values.osv.service.type }}
  ports:
    - name: http
      port: {{ .Values.osv.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "warden.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: osv
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "warden.fullname" . }}-osv
  labels:
    {{- include "warden.labels" . | nindent 4 }}
    app.kubernetes.io/component: osv
spec:
  replicas: {{ .Values.osv.replicaCount }}
  selector:
    matchLabels:
      {{- include "warden.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: osv
  template:
    metadata:
      labels:
        {{- include "warden.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: osv
    spec:
      serviceAccountName: {{ include "warden.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: osv
          image: "{{ .Values.osv.image.repository }}:{{ .Values.osv.image.tag }}"
          imagePullPolicy: {{ .Values.osv.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 9000
              protocol: TCP
          env:
            - name: OSV_URL
              value: {{ .Values.osv.env.osvUrl | quote }}
            - name: CACHE_TTL
              value: {{ .Values.osv.env.cacheTtl | quote }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 6
          resources:
            {{- toYaml .Values.osv.resources | nindent 12 }}
      {{- with .Values.osv.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.osv.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.osv.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
