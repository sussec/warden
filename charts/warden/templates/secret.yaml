{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
{{- $name := include "warden.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "warden.labels" . | nindent 4 }}
type: Opaque
stringData:
  system-password: {{ .Values.secrets.systemPassword | quote }}
  {{- if .Values.secrets.accessTokenKey }}
  access-token-key: {{ .Values.secrets.accessTokenKey | quote }}
  {{- else if and $existing $existing.data (index $existing.data "access-token-key") }}
  access-token-key: {{ index $existing.data "access-token-key" | b64dec | quote }}
  {{- else }}
  access-token-key: {{ randAlphaNum 32 | quote }}
  {{- end }}
  {{- if .Values.secrets.refreshTokenKey }}
  refresh-token-key: {{ .Values.secrets.refreshTokenKey | quote }}
  {{- else if and $existing $existing.data (index $existing.data "refresh-token-key") }}
  refresh-token-key: {{ index $existing.data "refresh-token-key" | b64dec | quote }}
  {{- else }}
  refresh-token-key: {{ randAlphaNum 32 | quote }}
  {{- end }}
  postgres-password: {{ .Values.secrets.postgresPassword | quote }}
  warden-token: {{ .Values.secrets.wardenToken | quote }}
  scan-git-token: {{ .Values.secrets.scanGitToken | quote }}
{{- end }}
