{{- if .Values.api.enabled }}
{{- if and .Values.api.scanWorkspace.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "warden.scanWorkspacePvc" . }}
  labels:
    {{- include "warden.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  accessModes:
    {{- toYaml .Values.api.scanWorkspace.accessModes | nindent 4 }}
  {{- if .Values.api.scanWorkspace.storageClass }}
  storageClassName: {{ .Values.api.scanWorkspace.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.api.scanWorkspace.size }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "warden.apiServiceName" . }}
  labels:
    {{- include "warden.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "warden.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
{{- if and .Values.api.compatServiceName (ne (include "warden.apiServiceName" .) (printf "%s-api" (include "warden.fullname" .))) }}
---
# Secondary Service name for tooling / fullname-based discovery
apiVersion: v1
kind: Service
metadata:
  name: {{ include "warden.fullname" . }}-api
  labels:
    {{- include "warden.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "warden.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "warden.fullname" . }}-api
  labels:
    {{- include "warden.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "warden.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "warden.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        checksum/config: {{ printf "%s-%s-%s" .Values.api.env.frontendUrl .Values.api.env.scanImagePrefix (include "warden.osvUrl" .) | sha256sum }}
    spec:
      serviceAccountName: {{ include "warden.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.api.podSecurityContext | nindent 8 }}
      {{- if .Values.api.dockerSocket.enabled }}
      # Allow talking to host docker for UI-triggered scans (dev / node-local only)
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.api.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: DB_SERVER
              value: {{ include "warden.dbHost" . | quote }}
            - name: DB_USERNAME
              value: {{ include "warden.dbUser" . | quote }}
            - name: DB_NAME
              value: {{ include "warden.dbName" . | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "warden.secretName" . }}
                  key: postgres-password
            - name: SYSTEM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "warden.secretName" . }}
                  key: system-password
            - name: ACCESS_TOKEN_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "warden.secretName" . }}
                  key: access-token-key
            - name: REFRESH_TOKEN_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "warden.secretName" . }}
                  key: refresh-token-key
            - name: FRONTEND_URL
              value: {{ .Values.api.env.frontendUrl | quote }}
            - name: OPENAPI_ENABLED
              value: {{ .Values.api.env.openApiEnabled | quote }}
            - name: AI_ENDPOINT
              value: {{ .Values.api.env.aiEndpoint | quote }}
            - name: AI_MODEL
              value: {{ .Values.api.env.aiModel | quote }}
            - name: WARDEN_AI_API_KEY
              value: {{ .Values.api.env.wardenAiApiKey | quote }}
            - name: WARDEN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "warden.secretName" . }}
                  key: warden-token
            - name: SCAN_IMAGE_PREFIX
              value: {{ .Values.api.env.scanImagePrefix | quote }}
            - name: SCAN_WORKSPACE_PATH
              value: {{ .Values.api.env.scanWorkspacePath | quote }}
            - name: SCAN_WORKSPACE_VOLUME
              value: {{ include "warden.scanWorkspacePvc" . | quote }}
            - name: SCAN_NETWORK
              value: {{ printf "%s" .Release.Namespace | quote }}
            - name: SCAN_WARDEN_URL
              value: {{ printf "http://%s:%v" (include "warden.apiServiceName" .) .Values.api.service.port | quote }}
            - name: SCAN_GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "warden.secretName" . }}
                  key: scan-git-token
            - name: OSV_SERVICE_URL
              value: {{ include "warden.osvUrl" . | quote }}
            {{- if .Values.api.dockerSocket.enabled }}
            - name: SCAN_DOCKER_SOCKET
              value: "unix:///var/run/docker.sock"
            {{- end }}
          volumeMounts:
            {{- if .Values.api.scanWorkspace.enabled }}
            - name: scan-workspace
              mountPath: {{ .Values.api.env.scanWorkspacePath }}
            {{- end }}
            {{- if .Values.api.dockerSocket.enabled }}
            - name: docker-sock
              mountPath: /var/run/docker.sock
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.api.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.api.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        {{- if .Values.api.scanWorkspace.enabled }}
        - name: scan-workspace
          persistentVolumeClaim:
            claimName: {{ include "warden.scanWorkspacePvc" . }}
        {{- end }}
        {{- if .Values.api.dockerSocket.enabled }}
        - name: docker-sock
          hostPath:
            path: {{ .Values.api.dockerSocket.path }}
            type: Socket
        {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
