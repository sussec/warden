{{- if .Values.api.enabled }}
{{- if .Values.api.scanWorkspace.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "warden.scanWorkspacePvc" . }}
  labels:
    {{- include "warden.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  accessModes:
    {{- toYaml .Values.api.scanWorkspace.accessModes | nindent 4 }}
  {{- $sc := .Values.api.scanWorkspace.storageClass | default .Values.global.defaultStorageClass }}
  {{- if $sc }}
  storageClassName: {{ $sc | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.api.scanWorkspace.size }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "warden.apiServiceName" . }}
  labels:
    {{- include "warden.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with .Values.api.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "warden.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
{{- if and .Values.api.compatServiceName (ne (include "warden.apiServiceName" .) (printf "%s-api" (include "warden.fullname" .))) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "warden.fullname" . }}-api
  labels:
    {{- include "warden.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "warden.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "warden.fullname" . }}-api
  labels:
    {{- include "warden.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.api.revisionHistoryLimit }}
  strategy:
    {{- toYaml .Values.api.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "warden.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "warden.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        checksum/secret: {{ include "warden.secretName" . | sha256sum }}
        checksum/config: {{ printf "%s|%s|%s|%s" .Values.api.env.frontendUrl .Values.api.env.scanImagePrefix .Values.api.env.trustedProxies (include "warden.osvUrl" .) | sha256sum }}
    spec:
      serviceAccountName: {{ include "warden.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.api.podSecurityContext | nindent 8 }}
      {{- if .Values.postgresql.enabled }}
      initContainers:
        - name: wait-for-db
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          command:
            - /bin/bash
            - -ec
            - |
              until pg_isready -h "{{ include "warden.dbHost" . }}" -p "{{ include "warden.dbPort" . }}" -U "{{ include "warden.dbUser" . }}"; do
                echo "waiting for postgres {{ include "warden.dbHost" . }}...";
                sleep 2;
              done
              echo "postgres is ready"
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.global.imageProject }}/{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.api.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: DB_SERVER
              value: {{ include "warden.dbHost" . | quote }}
            - name: DB_USERNAME
              value: {{ include "warden.dbUser" . | quote }}
            - name: DB_NAME
              value: {{ include "warden.dbName" . | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "warden.secretName" . }}
                  key: postgres-password
            - name: SYSTEM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "warden.secretName" . }}
                  key: system-password
            - name: ACCESS_TOKEN_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "warden.secretName" . }}
                  key: access-token-key
            - name: REFRESH_TOKEN_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "warden.secretName" . }}
                  key: refresh-token-key
            - name: FRONTEND_URL
              value: {{ .Values.api.env.frontendUrl | quote }}
            - name: OPENAPI_ENABLED
              value: {{ .Values.api.env.openApiEnabled | quote }}
            - name: TRUSTED_PROXIES
              value: {{ .Values.api.env.trustedProxies | quote }}
            - name: AI_ENDPOINT
              value: {{ .Values.api.env.aiEndpoint | quote }}
            - name: AI_MODEL
              value: {{ .Values.api.env.aiModel | quote }}
            - name: WARDEN_AI_API_KEY
              value: {{ .Values.api.env.wardenAiApiKey | quote }}
            - name: WARDEN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "warden.secretName" . }}
                  key: warden-token
            - name: SCAN_BACKEND
              value: {{ .Values.api.env.scanBackend | default "auto" | quote }}
            - name: SCAN_IMAGE_PREFIX
              value: {{ .Values.api.env.scanImagePrefix | quote }}
            - name: SCAN_WORKSPACE_PATH
              value: {{ .Values.api.env.scanWorkspacePath | quote }}
            - name: SCAN_WORKSPACE_VOLUME
              value: {{ include "warden.scanWorkspacePvc" . | quote }}
            - name: SCAN_NETWORK
              value: {{ .Release.Namespace | quote }}
            - name: SCAN_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: SCAN_WARDEN_URL
              value: {{ printf "http://%s:%v" (include "warden.apiServiceName" .) .Values.api.service.port | quote }}
            - name: SCAN_IMAGE_PULL_SECRET
              value: {{ .Values.api.env.scanImagePullSecret | default "" | quote }}
            - name: SCAN_GIT_IMAGE
              value: {{ .Values.api.env.scanGitImage | default "alpine/git:2.47.2" | quote }}
            - name: SCAN_GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "warden.secretName" . }}
                  key: scan-git-token
            - name: OSV_SERVICE_URL
              value: {{ include "warden.osvUrl" . | quote }}
            - name: DB_MAX_POOL_SIZE
              value: {{ .Values.api.env.dbMaxPoolSize | default "100" | quote }}
            - name: DB_MIN_POOL_SIZE
              value: {{ .Values.api.env.dbMinPoolSize | default "5" | quote }}
            {{- if .Values.redis.enabled }}
            - name: REDIS_CONNECTION
              value: {{ printf "%s-redis:%v" (include "warden.fullname" .) (.Values.redis.service.port | default 6379) | quote }}
            {{- else if .Values.api.env.redisConnection }}
            - name: REDIS_CONNECTION
              value: {{ .Values.api.env.redisConnection | quote }}
            {{- end }}
            {{- if .Values.api.dockerSocket.enabled }}
            - name: SCAN_DOCKER_SOCKET
              value: "unix:///var/run/docker.sock"
            {{- end }}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            {{- if .Values.api.scanWorkspace.enabled }}
            - name: scan-workspace
              mountPath: {{ .Values.api.env.scanWorkspacePath }}
            {{- end }}
            {{- if .Values.api.dockerSocket.enabled }}
            - name: docker-sock
              mountPath: /var/run/docker.sock
            {{- end }}
            - name: tmp
              mountPath: /tmp
          {{- if .Values.api.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.api.startupProbe.httpGet.path }}
              port: {{ .Values.api.startupProbe.httpGet.port }}
            periodSeconds: {{ .Values.api.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.api.startupProbe.failureThreshold }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.api.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.api.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.api.scanWorkspace.enabled }}
        - name: scan-workspace
          persistentVolumeClaim:
            claimName: {{ include "warden.scanWorkspacePvc" . }}
        {{- end }}
        {{- if .Values.api.dockerSocket.enabled }}
        - name: docker-sock
          hostPath:
            path: {{ .Values.api.dockerSocket.path }}
            type: Socket
        {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $affinity := .Values.api.affinity }}
      {{- if or $affinity .Values.api.podAntiAffinity }}
      affinity:
        {{- with $affinity }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.api.podAntiAffinity }}
        {{- include "warden.podAntiAffinity" (dict "root" . "component" "api" "mode" .Values.api.podAntiAffinity) | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
