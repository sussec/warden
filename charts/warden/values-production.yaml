# Production overrides — domain-based registry (override global.imageRegistry as needed)
#
# helm upgrade --install warden ./charts/warden -n warden --create-namespace \
#   -f charts/warden/values-production.yaml \
#   --set global.imageRegistry=harbor.example.com \
#   --set secrets.systemPassword='...' \
#   --set api.env.frontendUrl='https://warden.example.com'

global:
  imageRegistry: harbor.techanv.com
  imageProject: library
  defaultStorageClass: ""

api:
  image:
    repository: warden
    tag: latest
    pullPolicy: Always
  replicaCount: 2
  dockerSocket:
    enabled: false
  scanWorkspace:
    accessModes:
      - ReadWriteOnce
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  env:
    openApiEnabled: "false"
    frontendUrl: "https://warden-prod.techanv.com"
    trustedProxies: "10.42.0.0/16,10.43.0.0/16"
    scanImagePrefix: "harbor.techanv.com/library/warden-"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  podAntiAffinity: soft

web:
  image:
    repository: warden-web
    tag: latest
    pullPolicy: Always
  replicaCount: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  podAntiAffinity: soft

osv:
  image:
    repository: warden-osv
    tag: latest
    pullPolicy: Always
  replicaCount: 2
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  podAntiAffinity: soft

postgresql:
  image:
    repository: docker.io/pgvector/pgvector
    tag: pg18
    pullPolicy: IfNotPresent
  persistence:
    size: 50Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

networkPolicy:
  enabled: true
  restrictEgress: false

# Prefer Cloudflare Tunnel; enable Ingress only if you terminate TLS in-cluster
ingress:
  enabled: false
  className: traefik
  hosts:
    - host: warden-prod.techanv.com
      paths:
        - path: /
          pathType: Prefix
          service: web
  tls: []
