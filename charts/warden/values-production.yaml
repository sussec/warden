# Production-oriented overrides (example)
# helm upgrade --install warden ./charts/warden -n warden -f charts/warden/values-production.yaml \
#   --set secrets.systemPassword='...' \
#   --set secrets.accessTokenKey='...' \
#   --set secrets.refreshTokenKey='...' \
#   --set secrets.postgresPassword='...' \
#   --set secrets.wardenToken='...' \
#   --set api.env.frontendUrl='https://warden.example.com'

api:
  replicaCount: 2
  dockerSocket:
    enabled: false
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
  env:
    openApiEnabled: "false"
    frontendUrl: "https://warden.example.com"

web:
  replicaCount: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

postgresql:
  persistence:
    size: 50Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi

osv:
  replicaCount: 2

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  hosts:
    - host: warden.example.com
      paths:
        - path: /
          pathType: Prefix
          service: web
  tls:
    - secretName: warden-tls
      hosts:
        - warden.example.com
