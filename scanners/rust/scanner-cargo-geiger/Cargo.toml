[package]
name = "scanner-cargo-geiger"
version = "1.0.0"
edition = "2021"
description = "cargo-geiger (unsafe usage) scanner wrapper for Techanv Warden"

[[bin]]
name = "scanner-cargo-geiger"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
