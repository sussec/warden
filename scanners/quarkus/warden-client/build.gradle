plugins {
    id 'java-library'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    // JSON (de)serialization for the CI ingest contract + scanner reports.
    api "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
}
