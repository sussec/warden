site_name: Techanv Warden
site_url: https://sussec.github.io/warden
site_author: Techanv Consulting
site_description: >-
  Techanv Warden is a self-hosted application security posture management
  (ASPM) and vulnerability management platform that consolidates SAST,
  secret-detection, and SCA findings from CI/CD pipelines.
repo_name: sussec/warden
repo_url: https://github.com/sussec/warden
edit_uri: "blob/main/docs/"
copyright: Copyright &copy; 2026 Techanv Consulting

theme:
  name: material
  logo: assets/images/logo.svg
  favicon: assets/images/logo.svg
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
  palette:
    # auto — follows the OS preference, with a manual toggle
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.action.edit
    - content.action.view
    - content.tabs.link
    - content.code.annotate
    - content.code.copy
    - content.tooltips
  font:
    text: Inter
    code: JetBrains Mono

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sussec/warden
      name: Warden on GitHub
  generator: false

plugins:
  - blog
  - search:
      separator: '[\s​\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - minify:
      minify_html: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Getting Started:
    - Overview: index.md
    - Installation: installation.md
    - System Setting:
      - General: setting/general.md
      - Access Token: setting/ci-token.md
      - Integration: setting/integration.md
  - Using Warden:
    - Dashboard: usage/dashboard.md
    - Scanners: usage/scanners.md
  - Security Integration:
    - security-integration/index.md
    - Environment Variables: security-integration/environment-variables.md
    - Static Application Security Testing (SAST):
      - Semgrep: security-integration/sast/semgrep.md
      - Gitleaks: security-integration/sast/gitleaks.md
      - TruffleHog: security-integration/sast/trufflehog.md
      - Kingfisher: security-integration/sast/kingfisher.md
      - Trivy IaC: security-integration/sast/trivy-iac.md
      - Checkov: security-integration/sast/checkov.md
      - CodeQL: security-integration/sast/codeql.md
      - Kubescape (K8s): security-integration/sast/kubescape.md
      - cargo-geiger (Rust): security-integration/sast/cargo-geiger.md
      - deepsec (AI SAST): security-integration/sast/deepsec.md
    - Software Composition Analysis (SCA):
      - Trivy: security-integration/sca/trivy.md
      - Grype: security-integration/sca/grype.md
      - OSV-Scanner: security-integration/sca/osv.md
      - CVE Lite CLI: security-integration/sca/cve-lite.md
      - cargo-audit (Rust): security-integration/sca/cargo-audit.md
      - cargo-deny (Rust): security-integration/sca/cargo-deny.md
      - OWASP Dependency-Check: security-integration/sca/dependency-check.md
      - Trivy License: security-integration/sca/trivy-license.md
      - Syft (SBOM): security-integration/sca/syft.md
      - GuardDog: security-integration/sca/guarddog.md
      - OSV Enrichment: security-integration/sca/osv-enrichment.md
    - Container & DAST:
      - Trivy Image: security-integration/container/trivy-image.md
      - OWASP ZAP: security-integration/dast/zap.md
      - Nuclei: security-integration/dast/nuclei.md
      - Nikto: security-integration/dast/nikto.md
    - Cloud Security (CSPM):
      - Prowler: security-integration/cloud/prowler.md
    - AI / LLM Security:
      - Augustus (LLM red-team): security-integration/ai/augustus.md
  - Blog:
    - blog/index.md
