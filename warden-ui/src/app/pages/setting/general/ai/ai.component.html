<div class="flex flex-col gap-4 w-full">
  <div class="flex flex-col gap-2 w-full">
    <div class="flex flex-row gap-2 w-full items-center">
      <span class="w-36 md:w-48">Enabled</span>
      <div class="w-full max-w-md">
        <p-toggle-switch [(ngModel)]="aiSetting.enabled"/>
      </div>
    </div>
    <div class="flex flex-row gap-2 w-full items-center">
      <span class="w-36 md:w-48">Provider</span>
      <div class="w-full max-w-md flex flex-col gap-1">
        <p-select styleClass="w-full"
                  [options]="providerPresets"
                  optionValue="value"
                  optionLabel="label"
                  [ngModel]="selectedProvider"
                  (ngModelChange)="onProviderChange($event)"/>
        <small class="text-muted-color">Any OpenAI-compatible API works.</small>
      </div>
    </div>
    <div class="flex flex-row gap-2 w-full items-center">
      <span class="w-36 md:w-48">Endpoint</span>
      <div class="w-full max-w-md">
        <input pInputText type="text" class="w-full" [(ngModel)]="aiSetting.endpoint"
               placeholder="https://api.openai.com/v1 or http://localhost:11434/v1">
      </div>
    </div>
    <div class="flex flex-row gap-2 w-full items-center">
      <span class="w-36 md:w-48">API Key</span>
      <div class="w-full max-w-md flex flex-col gap-1">
        <p-password [toggleMask]="true" [feedback]="false" styleClass="w-full" inputStyleClass="w-full"
                    [(ngModel)]="aiSetting.apiKey"/>
        <small class="text-muted-color">leave empty to keep current</small>
      </div>
    </div>
    <div class="flex flex-row gap-2 w-full items-center">
      <span class="w-36 md:w-48">Model</span>
      <div class="w-full max-w-md">
        <input pInputText type="text" class="w-full" [(ngModel)]="aiSetting.model"
               [placeholder]="currentPreset.modelPlaceholder">
      </div>
    </div>
    <div class="flex flex-row gap-2 w-full items-center">
      <span class="w-36 md:w-48">Embedding Model</span>
      <div class="w-full max-w-md">
        <input pInputText type="text" class="w-full" [(ngModel)]="aiSetting.embeddingModel"
               [placeholder]="currentPreset.embeddingPlaceholder">
      </div>
    </div>
  </div>
  <div class="flex flex-row gap-2 items-center">
    <p-button severity="primary" label="Save"
              [loading]="loading"
              [disabled]="loading"
              (click)="saveConfig()"/>
    <p-button severity="secondary" label="Test Connection"
              [loading]="loadingTest"
              [disabled]="loadingTest"
              (click)="testConnection()"/>
  </div>

  <!--SEMANTIC SEARCH-->
  <div class="flex flex-col gap-2 w-full border-t border-surface pt-4">
    <div class="font-semibold text-foreground">Semantic search</div>
    <small class="text-muted-color">
      Generates embeddings for existing findings. New findings are indexed automatically.
    </small>
    <div class="flex flex-row gap-2 items-center">
      <p-button severity="secondary" label="Build search index"
                [loading]="loadingBackfill"
                [disabled]="loadingBackfill"
                (click)="buildSearchIndex()"/>
    </div>
  </div>
</div>
